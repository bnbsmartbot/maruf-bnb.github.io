<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNB Smart Chain</title>
  <style>
    body {
      margin: 0;
      padding: 25px;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 55px;
      color: #f3ba2f;
    }

    h1 {
      font-size: 24px;
    }

    .card {
      background: #181818;
      padding: 22px;
      margin: 15px 0;
      border-radius: 18px;
    }

    .title {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
    }

    .bnb {
      color: #f3ba2f;
    }

    .network {
      color: #999;
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">◆</div>
    <h1>BNB Smart Chain</h1>
  </div>

  <div class="card">
    <div class="title">💰 Balance</div>
    <div class="value">0.00</div>
    <div class="network">Your Balance</div>
  </div>

  <div class="card">
    <div class="title">🟡 BNB</div>
    <div class="value bnb">0.00 BNB</div>
    <div class="network">BNB Smart Chain (BEP-20)</div>
  </div>

</body>
  </html>
